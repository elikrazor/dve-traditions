name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android project
        run: |
          test -f index.html || { echo "index.html not found in repository root"; exit 1; }
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/traditions/dve
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cp index.html app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "DveTraditions"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.traditions.dve'
              compileSdk 35
              defaultConfig {
                  applicationId "com.traditions.dve"
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.activity:activity-ktx:1.9.3'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@style/Theme.Dve"
                  android:allowBackup="true"
                  android:supportsRtl="true"
                  android:enableOnBackInvokedCallback="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/traditions/dve/MainActivity.kt <<'EOF'
          package com.traditions.dve

          import android.annotation.SuppressLint
          import android.os.Bundle
          import android.webkit.WebView
          import androidx.activity.ComponentActivity
          import androidx.activity.OnBackPressedCallback

          class MainActivity : ComponentActivity() {
              private lateinit var webView: WebView

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  webView = WebView(this).apply {
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      settings.databaseEnabled = true
                      settings.mediaPlaybackRequiresUserGesture = false
                      settings.textZoom = 100
                      settings.setSupportZoom(false)
                      settings.builtInZoomControls = false
                      setBackgroundColor(0xFF12101F.toInt())
                      loadUrl("file:///android_asset/index.html")
                  }
                  setContentView(webView)
                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          webView.evaluateJavascript(
                              "(function(){try{return window.__appBack?window.__appBack():false}catch(e){return false}})()"
                          ) { result -> if (result != "true") finish() }
                      }
                  })
              }

              override fun onPause() { webView.onPause(); super.onPause() }
              override fun onResume() { super.onResume(); webView.onResume() }
              override fun onDestroy() { webView.destroy(); super.onDestroy() }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Две Традиции</string>
          </resources>
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="launcher_bg">#1A1730</color>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.Dve" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">#12101F</item>
                  <item name="android:statusBarColor">#12101F</item>
                  <item name="android:navigationBarColor">#12101F</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:pathData="M44,40 L44,68 M35,49 L53,49"
                  android:strokeColor="#E8B451" android:strokeWidth="4.5"
                  android:strokeLineCap="round" android:fillColor="#00000000"/>
              <path android:pathData="M66,41 L77.3,60.5 L54.7,60.5 Z"
                  android:strokeColor="#6D9BF5" android:strokeWidth="3"
                  android:strokeLineJoin="round" android:fillColor="#00000000"/>
              <path android:pathData="M66,67 L54.7,47.5 L77.3,47.5 Z"
                  android:strokeColor="#6D9BF5" android:strokeWidth="3"
                  android:strokeLineJoin="round" android:fillColor="#00000000"/>
          </vector>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/launcher_bg"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk DveTraditions.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DveTraditions-APK
          path: DveTraditions.apk
